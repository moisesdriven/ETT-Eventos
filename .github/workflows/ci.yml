name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ett
          POSTGRES_PASSWORD: ett
          POSTGRES_DB: ett
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ett"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ett:ett@localhost:5432/ett
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Pruebas
        run: pnpm test
      - name: Migraciones (dos veces, deben ser idempotentes)
        run: pnpm db:migrate && pnpm db:migrate
      - name: Esquema sin cambios pendientes
        run: |
          cd packages/db
          out=$(pnpm exec drizzle-kit generate --name verificacion 2>&1)
          echo "$out"
          echo "$out" | grep -q "No schema changes"
      - name: Compilar web
        run: pnpm --filter @ett/web build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen web
        uses: docker/build-push-action@v6
        with: { context: ., target: web, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Imagen worker
        uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, cache-from: type=gha }
