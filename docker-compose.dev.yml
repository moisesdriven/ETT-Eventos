# Solo para desarrollo local: PostgreSQL aislado.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ett
      POSTGRES_PASSWORD: ett
      POSTGRES_DB: ett
    ports:
      - "5432:5432"
    volumes:
      - ett_pg_dev:/var/lib/postgresql/data
volumes:
  ett_pg_dev:
